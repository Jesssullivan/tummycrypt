# tcfs-backend Helm chart values
# Override with: helm install tcfs-backend ./infra/k8s/charts/tcfs-backend -f my-values.yaml

image:
  repository: ghcr.io/jesssullivan/tcfsd
  # Mutable convenience default only; set an explicit tag such as v0.12.12 for
  # release proof or production runs.
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

# Paused on honey (operator ruling 2026-09-29 "Close the tcfs source drift",
# TIN-5136). The live worker was scaled to 0 at 2026-09-29T16:45Z under the
# ruling "Cluster scale-to-0 only"; this default keeps a reconcile through
# scripts/tcfs-backend-deploy.sh from silently restarting it. Restore order
# (seaweedfs, then nats, then the Deployments) lives in
# docs/ops/tcfs-honey-cluster-pause-2026-09-29.md. Restore with
# --set replicaCount=1 --set autoscaling.minReplicas=1 only after seaweedfs-0
# and nats-0 are Ready.
replicaCount: 0

nameOverride: ""
fullnameOverride: ""

# tcfsd daemon configuration
config:
  natsUrl: "nats://nats.tcfs.svc.cluster.local:4222"
  s3Endpoint: "http://seaweedfs.tcfs.svc.cluster.local:8333"
  s3Region: "us-east-1"
  s3Bucket: "tcfs"
  logLevel: "info"
  logFormat: "json"
  workerConcurrency: 4

# Credentials secret (must contain access_key_id and secret_access_key)
credentialsSecret: seaweedfs-admin

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"

# KEDA ScaledObject configuration
autoscaling:
  enabled: true
  # Paused with replicaCount (TIN-5136): a KEDA floor above 0 would scale the
  # worker back up and reopen the drift.
  minReplicas: 0
  maxReplicas: 100
  lagThreshold: 100
  cooldownPeriod: 300
  # natsMonitoringUrl must be set if autoscaling is enabled
  natsMonitoringUrl: "http://nats.tcfs.svc.cluster.local:8222"

metrics:
  enabled: true
  port: 9100
  serviceMonitor:
    enabled: true
    interval: 30s

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: "50%"

nodeSelector: {}
tolerations: []
affinity: {}
