# Captured read-only from honey (tcfs) on 2026-09-29 at the TIN-5136 pause.
# Ruling: "Follow-up PR: capture at 0 replicas" (TIN-5136). Server-set fields
# stripped; everything else is the live spec. Do not apply without a restore
# ruling; see docs/ops/tcfs-honey-cluster-pause-2026-09-29.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: github-smoke-s3-tunnel
    app.kubernetes.io/name: tcfs-s3-smoke-tunnel
    app.kubernetes.io/part-of: tcfs
  name: tcfs-s3-smoke-tunnel
  namespace: tcfs
spec:
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: tcfs-s3-smoke-tunnel
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: github-smoke-s3-tunnel
        app.kubernetes.io/name: tcfs-s3-smoke-tunnel
        app.kubernetes.io/part-of: tcfs
    spec:
      containers:
        - args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://seaweedfs.tcfs.svc.cluster.local:8333
          image: cloudflare/cloudflared:latest
          imagePullPolicy: Always
          name: cloudflared
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
