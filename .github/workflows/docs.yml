# Deploy documentation to GitHub Pages
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", ".lychee.toml", "Taskfile.yaml"]
  pull_request:
    paths: ["docs/**", "README.md", ".lychee.toml", "Taskfile.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml "docs/**/*.md" "README.md"
          fail: true

  build-pdf:
    name: Build PDFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # `task docs:pdf` reads only docs/tex/*.tex (Taskfile.yaml docs:pdf), so a
      # markdown-only change under docs/** has no PDF to rebuild and must not
      # pull a TeX toolchain — a network-flaky step that fails on upstream 429s.
      # GitHub has no per-job `paths:`, so the job narrows the workflow trigger
      # itself. Anything that cannot be diffed reliably still builds.
      - name: Detect PDF source changes
        id: sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] \
            || [ -z "${BASE_SHA}" ] \
            || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- \
            docs/tex Taskfile.yaml)"
          if [ -n "${changed}" ]; then
            echo "PDF sources changed:"
            echo "${changed}"
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "No docs/tex or Taskfile.yaml change; skipping task docs:pdf."
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.sources.outputs.changed == 'true'
        uses: cachix/install-nix-action@v30

      - name: Build PDF docs
        if: steps.sources.outputs.changed == 'true'
        run: nix develop --accept-flake-config --command task docs:pdf

      - name: Upload PDF artifacts
        if: steps.sources.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tcfs-docs-pdf
          path: dist/docs/*.pdf
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [check-links]
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs/
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
